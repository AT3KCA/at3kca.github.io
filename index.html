<html>

<style>
html {
	font-size: 17px;

#canvas {
	z-index: -100;
	position: fixed;
	width: 100vw;
	height: 100vh;
}
* {
	padding: 0;
	margin: 0;
	box-sizing: border-box;
	color: #e6e6e6;
}
.background {
	background-color: #161616;
}
.container {
	margin: 1rem auto 0 auto;
	max-width: 70rem;
	display: flex;
	flex-direction: column;
}
.border {
	margin: 0 1rem;

h1:hover,
h2:hover,

	text-shadow: 0px 0px 10px #b5fff8A0;
}
hr {
	width: 95%;
	margin: 0 auto;
	height: 1px;
	color: #ffbff65c;
}
.s1 {
	border-bottom: 1px solid #ebb5ffb2; 
}
.s2 {
	border-bottom: 1px solid #ffd8b5b2; 
}

p {
	line-height: 1.5;
	margin: 0.9rem 0 0.9rem 0;
	transition: all 0.15s;
}
p:hover {
	text-shadow: 0px 0px 10px #00FFB7A0;
}

a,
a:link,
a:visited {
	transition: all 0.3s;
	color: #ffbff6;
	text-decoration: underline;
}
a:hover {
	color: #e5ffbf;
}
a:active {
	text-decoration: underline;
}

strong {
	font-weight: normal;
